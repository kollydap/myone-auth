services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: myone
      POSTGRES_PASSWORD: myone_dev_pw
      POSTGRES_DB: myone_auth
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myone"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src          # hot reload — edit locally, see it live
      - ./migrations:/app/migrations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn myone_auth.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pg_data: